version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.app
    container_name: pakquiz-app
    working_dir: /app
    volumes:
      - ./:/app
    environment:
      - DB_CONNECTION=sqlite
      - DB_DATABASE=/app/database/database.sqlite
    networks:
      - pakquiz-network

  nginx:
    image: nginx:latest
    container_name: web
    ports:
      - "8080:80"
    volumes:
      - ./:/app
      - ./default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - pakquiz-network

networks:
  pakquiz-network:
    driver: bridge
